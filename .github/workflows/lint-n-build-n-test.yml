# This is a basic workflow to help you get started with Actions

name: ⚙️ CI/CD - Lint & Build & Test

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
  push:
    branches:
      - main
      - develop
      - "releases/**"
    tags:
      - "**"
  pull_request:
    branches:
      - main
      - develop
      - "releases/**"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  lint:
    name: 🧪 Lint
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN }}

      - name: 🎒 Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: 📥 Install pnpm
        uses: pnpm/action-setup@v2
        id: pnpm-install
        with:
          version: 8
          run_install: false

      - name: 🔎 Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: 💾 Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📦 Install Dependencies
        run: pnpm install

      - name: 🧪 Run Linter & Build Check
        run: pnpm run build:check

  build:
    name: 🔧 Build
    runs-on: ubuntu-latest
    needs:
      - lint

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: 🎒 Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: 📥 Install pnpm
        uses: pnpm/action-setup@v2
        id: pnpm-install
        with:
          version: 8
          run_install: false

      - name: 🔎 Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: 💾 Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📦 Install Dependencies
        run: pnpm install

      - name: 🔧 Run Build
        run: |
          pnpm run build:prod
          pnpm run build:type
          pnpm run build:assets

      - name: 💼 Packing
        if: ${{ contains(github.ref, 'refs/heads/main') || contains(github.ref, 'refs/tags/') }}
        run: |
          pnpm pack
          tar -zxvf *.tgz

      - name: 🚀 Publish Packages (Rolling)
        if: ${{ contains(github.ref, 'refs/heads/main') }}
        uses: JamesIves/github-pages-deploy-action@4.1.0
        with:
          branch: release # The branch the action should deploy to.
          folder: package/ # The folder the action should deploy.

      - name: 🚀 Publish Packages (Tagged)
        if: ${{ contains(github.ref, 'refs/tags/') }}
        run: |
          pnpm publish
        env:
          GH_NPM_REGISTRY_AUTH_TOKEN: ${{ secrets.GH_NPM_REGISTRY_AUTH_TOKEN }}
